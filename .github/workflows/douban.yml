name: Douban movies to NeoDB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sync watched movies
        uses: lizheming/doumark-action@master
        with:
          id: 1763879
          type: movie
          status: done
          format: neodb
          neodb_token: ${{ secrets.NEODB_TOKEN }}
